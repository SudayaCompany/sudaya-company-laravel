# Nginx untuk Sudaya Coffee (satu VPS, Nginx + PHP-FPM). Dipasang deploy/scripts/provision.sh
# ke /etc/nginx/sites-available/sudaya dengan __DOMAIN__ diganti domain asli. Blok HTTPS
# (listen 443, sertifikat, redirect http → https) ditambahkan otomatis oleh certbot.
#
# Header keamanan (CSP, HSTS, X-Frame-Options, ...) dikirim aplikasi; jangan ditambahkan di sini.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/sudaya/current/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Foto menu/absen/QRIS dibatasi aplikasi 2–3 MB; batas ini sedikit di atasnya.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =404; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri /index.php?$query_string; }

    # Aset Vite dan font bernama hash: aman di-cache setahun.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~ ^/(images|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Aplikasi staf (PWA): service worker dan manifest selalu dicek ulang agar versi baru cepat dipakai.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/sudaya-fpm.sock;
        include fastcgi_params;
        # $realpath_root mengikuti symlink `current`, jadi rilis baru langsung dipakai.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # IP asli pengunjung untuk rate limit (TRUSTED_IP_HEADER=X-Real-IP). Header X-Real-IP
        # kiriman pengunjung ditimpa nilai ini, jadi tidak bisa dipalsukan.
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # File PHP lain dan file tersembunyi (.env, .git, ...) tidak pernah dilayani.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known/) { deny all; }

    access_log /var/log/nginx/sudaya.access.log;
    error_log /var/log/nginx/sudaya.error.log warn;
}
