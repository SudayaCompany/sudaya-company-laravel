; PHP-FPM pool Sudaya Coffee. Dipasang provision.sh ke /etc/php/<versi>/fpm/pool.d/sudaya.conf
; (pool bawaan "www" dinonaktifkan). Worker berjalan sebagai user sudaya, pemilik folder aplikasi.
[sudaya]
user = sudaya
group = sudaya
listen = /run/php/sudaya-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Tiap worker ±60–90 MB RAM dan memegang 1 koneksi ke session pooler Supabase. 10 worker
; cukup untuk satu outlet (kasir, barista, HP pelanggan) dan aman untuk VPS 2 GB. Naikkan
; hanya bila RAM cukup dan masih di bawah batas klien pooler paket Supabase.
pm = dynamic
pm.max_children = 10
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

request_terminate_timeout = 120s
catch_workers_output = yes
php_admin_value[error_log] = /var/www/sudaya/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
