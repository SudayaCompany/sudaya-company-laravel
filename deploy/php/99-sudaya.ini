; Pengaturan PHP production Sudaya Coffee (FPM dan CLI). Dipasang provision.sh ke
; /etc/php/<versi>/{fpm,cli}/conf.d/99-sudaya.ini.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
zend.exception_ignore_args = On

memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 12M

; Kode hanya berubah lewat rilis baru (folder baru + reload PHP-FPM), jadi timestamp tidak dicek.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600

session.cookie_httponly = 1
